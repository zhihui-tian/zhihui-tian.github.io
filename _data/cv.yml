    Experience:
      - company: Lawrence Livermore National Laboratory (LLNL)
        position: Collaborative Research Project
        location: Remote / Gainesville, FL
        start_date: 2025-09
        end_date: present
        summary: Scalable hybrid CNN-GNN surrogate for 3D grain growth.
        highlights:
          - Conducted computational experiments and benchmarking for a hybrid bijective autoencoder and graph neural network (AE+GNN) surrogate model.
          - Developed the latent-space inference strategy and conducted scalability studies, achieving up to 117x memory reduction and 115x runtime improvement on 3D meshes up to 160^3 relative to a GNN-only baseline.
          - Established and applied quantitative statistical benchmarks to evaluate surrogate predictions against Monte Carlo ground truth.

      - company: SmartDATA Lab, University of Florida
        position: Graduate Research Assistant
        location: Gainesville, FL
        start_date: 2023-05
        end_date: present
        highlights:
          - "Physics-regulated interpretable ML for 3D microstructure evolution: developed a scalable 3D architecture with strong spatiotemporal extrapolation across large simulation domains; extended the physics-regulated framework to inclination- and misorientation-dependent grain boundary dynamics; applied the model to Lab-DCT experimental data with quantitative comparison against ML predictions."
          - "Computer vision and deep learning for experimental microstructure analysis: developed and optimized a TEM image preprocessing pipeline that improves registration accuracy; adapted and fine-tuned U-Net and the Segment Anything Model for microstructure segmentation of registered TEM images."
          - "Gaussian-sampled mode filter for learning and emulating microstructure evolution: designed Gaussian-sampled kernels that emulate grain boundary motion and mitigate lattice pinning artifacts; demonstrated improved von Neumann-Mullins law adherence over classical Monte Carlo Potts models; analyzed energy-mobility interactions for interpretable modeling."

